<!DOCTYPE html>
<html>
  <head>

  <body>
    <input type="text">
    <button type="button" name="button">Enviar!</button>
    <script type="text/javascript">

    function imprimir(text)
      {
        document.write(text);
      }

    function condicao()
      {
        if (parseInt(recebe.value) == segredo)
          alert("Acertou!");
        else
          alert("Errou.");

        recebe.value = "";
        recebe.focus;

    var segredo = Math.round(Math.random() * 10);
