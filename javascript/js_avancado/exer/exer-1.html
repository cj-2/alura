<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title></title>
  </head>
  <body>
    <script type="text/javascript">
      class Conta {
        constructor(titular, conta){
          this._titular = titular;
          this._conta = conta;
          this._saldo = 0.0;
        }
        deposita(valor){
          this._saldo += valor;
        }
        get saldo(){
          return this._saldo;
        }
        get titular(){
          return this._titular;
        }
        get conta(){
          return this._conta;
        }
      }
      let conta = new Conta('Robson', 128);

      conta.deposita(100);
      console.log('Titular: ' + conta.titular);
      console.log('Conta: ' + conta.conta);
      console.log('Saldo: ' + conta.saldo);
    </script>
  </body>
</html>
