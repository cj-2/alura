<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title></title>
  </head>
  <body>
    <script type="text/javascript">
    // Estou criando um array de números
    let numeros = [30,10];

    // Estouy criando uma função que soma dois números.
    function somaDoisN(n1, n2){
      return n1 + n2;
    }

    // Estou criando a variavel soma que recebe o resultado da função
    // somaDoisN() com os valores do array numeros (separados pelo "...").
    // Spread Operator
    let soma = somaDoisN(...numeros);
    console.log(soma);

    </script>
  </body>
</html>
